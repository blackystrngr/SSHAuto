[project]
name = "sshauto"
version = "1.0.0"
description = "SSH-over-WebSocket relay autoscript for Debian/Ubuntu VPS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "uvloop"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
